services:
  postgres:
    image: postgres:17-alpine
    container_name: applymatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: applymatch
      POSTGRES_USER: applymatch
      POSTGRES_PASSWORD: applymatch
    ports:
      - "5433:5432"
    volumes:
      - applymatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applymatch -d applymatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  applymatch_postgres_data: